<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>starterkit-intro demo</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f4f5f7; color: #1f2430; }
      header { display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: #fff; border-bottom: 1px solid #d9dce3; }
      header h1 { margin: 0 auto 0 0; font-size: 18px; }
      /* The help button and switch are themed by the package; on a light page
         they inherit its dark-preset fallbacks, so give them a dark chip. */
      .tools { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 12px; background: #161925; }
      main { max-width: 960px; margin: 0 auto; padding: 24px; }
      section { margin-bottom: 120px; padding: 24px; background: #fff; border: 1px solid #d9dce3; border-radius: 16px; min-height: 160px; }
      section h2 { margin: 0 0 8px; font-size: 20px; }
      .alerts { padding: 8px 16px; border: 0; border-radius: 10px; background: #4f46e5; color: #fff; font: inherit; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
