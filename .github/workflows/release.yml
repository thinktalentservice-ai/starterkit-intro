name: Release

# Fires when a GitHub Release is published.
#   build  -> full CI (typecheck, tests, build, browser tests)
#   npm    -> publish to npm        (only if build passed)
#   pages  -> publish Storybook     (only if build passed AND GitHub Pages is
#                                    already enabled for this repo)
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  npm:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Secret NPM_TOKEN lives in this environment, not in repo-level secrets.
    environment: npm
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Release tag must match package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG="$(node -p "require('./package.json').version")"
          if [ "${TAG#v}" != "$PKG" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG'"
            exit 1
          fi

      - run: pnpm build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAG_FLAG=""
          if [ "$PRERELEASE" = "true" ]; then TAG_FLAG="--tag next"; fi
          pnpm publish --access public --no-git-checks $TAG_FLAG

  pages-gate:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if BUILD_TYPE="$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null)"; then
            echo "GitHub Pages is enabled (source: $BUILD_TYPE)"
            if [ "$BUILD_TYPE" != "workflow" ]; then
              echo "::error::Pages source is '$BUILD_TYPE'. Switch Settings > Pages > Source to 'GitHub Actions' so this job can deploy."
              exit 1
            fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub Pages not enabled for this repo -> skipping Storybook publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  pages:
    needs: pages-gate
    if: needs.pages-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds Storybook into ./docs (+ .nojekyll)
      - run: pnpm build-storybook

      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
