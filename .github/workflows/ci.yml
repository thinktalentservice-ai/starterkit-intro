name: CI

# Runs on every push (any branch), every PR, and is reused by release.yml as a
# gate. The job below is named "verify" -> its required-check context is
# "CI / verify". Mark that check as required in the branch ruleset so a PR can
# only merge when the build is green.
on:
  push:
    branches: ['**']
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v7 targets Node 24 natively; matches the sibling starterkit repos.
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck + browser typecheck + unit tests + library build (tsup)
      - run: pnpm verify

      # jsdom cannot lay anything out, so `pnpm verify` only proves the
      # extraction rules. Whether a bone lands on its element is proven here.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:browser
